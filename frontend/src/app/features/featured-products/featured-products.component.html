<div class="title-container title-spacing-default">
  <h2 class="featured-title">{{ titulo }}</h2>
</div>

<div class="products-container" *ngIf="products && products.length > 0">
  <div class="product-card" *ngFor="let product of products">
    <div class="card-image-container">
      <app-favorite-button class="favorite-action" [productId]="product.id!" [productName]="product.name" />

      <div class="image-wrapper">
        @let imagePath = product.image_paths?.[0];
      <app-product-media
          [image]="imagePath ? { id: 0, url: imagePath.startsWith('http') ? imagePath : backendUrl + '/' + imagePath, alt: product.name, position: 0 } : null"
          [showCaption]="false"
        />
      </div>
    </div>

    <div class="card-body">
      <h3 class="card-title">{{ product.name }}</h3>
      <div class="card-footer">
        <button class="btn-price" type="button" (click)="cart.add(product.id!)" [disabled]="cart.pending().has(product.id!) || product.quantity < 1" [attr.aria-busy]="cart.pending().has(product.id!)" [attr.aria-label]="'Adicionar ' + product.name + ' ao carrinho'">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-basket-icon lucide-shopping-basket"><path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/></svg>
          {{ cart.pending().has(product.id!) ? 'Adicionando…' : (product.price | currency : "BRL") }}
        </button>
        <button class="btn-details" [routerLink]="['/produto', product.id]">Ver Detalhes</button>
      </div>
      @if (cart.feedback()[product.id!]) { <p role="status">{{ cart.feedback()[product.id!] }}</p> }
    </div>
  </div>
</div>
