<div class="admin-layout" [class.sidebar-collapsed]="isSidebarCollapsed">
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="/LOGOTIPO.svg" alt="Box Enxovais" class="logo" />
      <button class="menu-toggle" (click)="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li [class.active]="router.url.includes('/admin/dashboard')">
          <a
            routerLink="dashboard"
            routerLinkActive="active"
            (click)="collapseAllMenus()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-layout-grid-icon lucide-layout-grid"
            >
              <rect width="7" height="7" x="3" y="3" rx="1" />
              <rect width="7" height="7" x="14" y="3" rx="1" />
              <rect width="7" height="7" x="14" y="14" rx="1" />
              <rect width="7" height="7" x="3" y="14" rx="1" />
            </svg>
            <span class="nav-text">Dashboard</span>
          </a>
        </li>

        <li class="dropdown" [class.open]="isProductMenuOpen">
          <button
            type="button"
            class="dropdown-toggle"
            (click)="toggleProductMenu($event)"
          >
            <!-- <i class="fas fa-box"></i> -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-box-icon lucide-box"
            >
              <path
                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
              />
              <path d="m3.3 7 8.7 5 8.7-5" />
              <path d="M12 22V12" />
            </svg>
            <span class="nav-text">Produtos</span>
            <i
              class="fas fa-chevron-down arrow"
              [class.open]="isProductMenuOpen"
            ></i>
          </button>
          <ul class="submenu" [class.show]="isProductMenuOpen">
            <li>
              <a routerLink="/admin/product/create" routerLinkActive="active"
                >Cadastro</a
              >
            </li>
            <li>
              <a routerLink="product/image-upload" routerLinkActive="active"
                >Imagens</a
              >
            </li>
          </ul>
        </li>

        <li class="dropdown" [class.open]="isPromotionMenuOpen">
          <button
            type="button"
            class="dropdown-toggle"
            (click)="togglePromotionMenu($event)"
          >
            <!-- <i class="fas fa-tags"></i> -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-tags-icon lucide-tags"
            >
              <path
                d="M13.172 2a2 2 0 0 1 1.414.586l6.71 6.71a2.4 2.4 0 0 1 0 3.408l-4.592 4.592a2.4 2.4 0 0 1-3.408 0l-6.71-6.71A2 2 0 0 1 6 9.172V3a1 1 0 0 1 1-1z"
              />
              <path
                d="M2 7v6.172a2 2 0 0 0 .586 1.414l6.71 6.71a2.4 2.4 0 0 0 3.191.193"
              />
              <circle cx="10.5" cy="6.5" r=".5" fill="currentColor" />
            </svg>
            <span class="nav-text">Promoções</span>
            <i
              class="fas fa-chevron-down arrow"
              [class.open]="isPromotionMenuOpen"
            ></i>
          </button>
          <ul class="submenu" [class.show]="isPromotionMenuOpen">
            <li>
              <a routerLink="/admin/promotion/create" routerLinkActive="active"
                >Criar / Ver</a
              >
            </li>
          </ul>
        </li>

        <li [class.active]="router.url.includes('/admin/report')">
          <a
            routerLink="report"
            routerLinkActive="active"
            (click)="collapseAllMenus()"
          >
            <!-- <i class="fas fa-file-alt"></i> -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-file-archive-icon lucide-file-archive"
            >
              <path d="M10 12v-1" />
              <path d="M10 18v-2" />
              <path d="M10 7V6" />
              <path d="M14 2v4a2 2 0 0 0 2 2h4" />
              <path
                d="M15.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v16a2 2 0 0 0 .274 1.01"
              />
              <circle cx="10" cy="20" r="2" />
            </svg>
            <span class="nav-text">Relatórios</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <button class="logout-btn">
        <i class="fas fa-sign-out-alt"></i>
        <span class="nav-text">Sair</span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-log-out-icon lucide-log-out"
        >
          <path d="m16 17 5-5-5-5" />
          <path d="M21 12H9" />
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        </svg>
      </button>
    </div>
  </aside>

  <!-- Conteúdo -->
  <main class="content">
    <header class="topbar">
      <div class="user-profile">
        <i class="fas fa-user-circle"></i>
        <div class="info">
          <span class="user-name">Renee McKelvey</span>
          <span class="user-title">Product Manager</span>
        </div>
      </div>
    </header>

    <section class="content-body">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
