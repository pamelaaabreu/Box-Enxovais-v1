<header class="navbar-container" [class.navbar-hidden]="isHidden">
  <nav class="navbar-custom" aria-label="Categorias de produtos">
    <button
      #categoryToggle
      type="button"
      class="category-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="category-links"
      aria-label="Menu de categorias"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span>Categorias</span>
      <svg
        class="category-chevron"
        [class.is-open]="isMenuOpen"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    <ul id="category-links" class="nav-menu" [class.is-open]="isMenuOpen">
      <li class="nav-item" *ngFor="let category of categories">
        <a
          [routerLink]="['/categoria', category.slug]"
          class="nav-link"
          (click)="closeMenu()"
          >{{ category.name }}</a
        >
      </li>
    </ul>
  </nav>
</header>
