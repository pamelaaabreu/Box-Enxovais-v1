<div class="top-navbar" [ngClass]="{ 'navbar-scrolled': isScrolled }">
  <div class="logo">
    <a routerLink="/home">
      <span class="brand-symbol" aria-hidden="true"></span>
      <span class="brand-name">BOX ENXOVAIS</span>
      <span class="brand-tagline">CASA BEM VIVIDA</span>
    </a>
  </div>

  <div class="search-bar">
    <input
      type="search"
      aria-label="Buscar produtos"
      placeholder="O que você procura?"
      class="search-input"
    />
    <span class="search-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
    </span>
  </div>

  <div class="account-cart">
    <!-- Renderiza apenas depois de carregar -->
    <ng-container *ngIf="!isLoading">
      <!-- Usuário NÃO autenticado -->
      <div *ngIf="!isLoggedIn" class="user-profile-menu">
        <button
          class="profile-btn"
          (click)="toggleMenu($event)"
          [attr.aria-expanded]="isMenuOpen"
          aria-controls="guest-menu"
          (keydown.escape)="isMenuOpen = false"
        >
          <span>Minha conta</span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
        <div id="guest-menu" class="dropdown-menu" [class.show]="isMenuOpen">
          <ul>
            <li>
              <a routerLink="/login"
                >Login<svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="m10 17 5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
                  /></svg
              ></a>
            </li>
            <li>
              <a routerLink="/register"
                >Cadastro<svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="7" r="4" />
                  <path d="M5 21v-2a7 7 0 0 1 14 0v2" /></svg
              ></a>
            </li>
          </ul>
        </div>
      </div>

      <!-- Usuário autenticado -->
      <div *ngIf="isLoggedIn" class="user-profile-menu">
        <button
          class="profile-btn"
          (click)="toggleMenu($event)"
          [attr.aria-expanded]="isMenuOpen"
          aria-controls="account-menu"
          (keydown.escape)="isMenuOpen = false"
        >
          <span>Olá, {{ userName }}</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            [class.open]="isMenuOpen"
          >
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div id="account-menu" class="dropdown-menu" [class.show]="isMenuOpen">
          <ul>
            <li>
              <a routerLink="/account">
                Minha Conta
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </a>
            </li>

            <li>
              <a routerLink="/orders">
                Meus Pedidos
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="m12 2 9 5v10l-9 5-9-5V7l9-5Z M3 7l9 5 9-5 M12 12v10 M7.5 4.5l9 5"
                  />
                </svg>
              </a>
            </li>

            <li *ngIf="isAdmin">
              <a routerLink="/admin">Admin</a>
            </li>

            <li class="divider"></li>

            <li>
              <button (click)="logout()">
                Sair
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m16 17 5-5-5-5" />
                  <path d="M21 12H9" />
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                </svg>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </ng-container>

    <!-- Botão do carrinho -->
    <button
      class="cart-btn"
      type="button"
      routerLink="/cart"
      [attr.aria-label]="'Carrinho de compras, ' + cartCount + ' itens'"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 7h14l1 14H4L5 7Z" />
        <path d="M8 9V5a4 4 0 0 1 8 0v4" />
      </svg>
      <span class="cart-badge" aria-hidden="true">{{ cartCount }}</span>
    </button>
  </div>
</div>
