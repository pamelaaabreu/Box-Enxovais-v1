<div class="carousel-container">
  <div
    id="carouselExampleIndicators"
    class="carousel slide"
    data-bs-ride="carousel"
    data-bs-interval="8000"
    aria-label="Coleções e campanhas"
  >
    <div class="carousel-indicators">
      <button
        type="button"
        data-bs-target="#carouselExampleIndicators"
        data-bs-slide-to="0"
        class="active"
        aria-label="Essência natural"
      ></button>

      <button
        type="button"
        data-bs-target="#carouselExampleIndicators"
        data-bs-slide-to="1"
        aria-label="Campanha 2"
      ></button>

      <button
        type="button"
        data-bs-target="#carouselExampleIndicators"
        data-bs-slide-to="2"
        aria-label="Campanha 3"
      ></button>

      <button
        type="button"
        data-bs-target="#carouselExampleIndicators"
        data-bs-slide-to="3"
        aria-label="Campanha 4"
      ></button>
    </div>

    <div class="carousel-inner">
      <div class="carousel-item active">
        <section class="collection-hero" aria-labelledby="collection-title">
          <div class="hero-artwork">
            <img
              class="hero-photo"
              src="/banner-box-enxovais.png"
              alt="Cama com enxoval off-white, manta oliva e mesa de cabeceira em madeira"
              fetchpriority="high"
            />
          </div>

          <div class="hero-copy">
            <p class="hero-eyebrow">CONFORTO QUE INSPIRA</p>
            <h1 id="collection-title">COLEÇÃO <span>essência natural</span></h1>
            <p class="hero-season">LANÇAMENTO 2026</p>
            <a class="hero-cta" href="/home#colecao"
              >VER COLEÇÃO
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path d="M4 12h16m-6-6 6 6-6 6" /></svg
            ></a>

            <ul class="hero-benefits">
              <li>TECIDOS DE ALTA QUALIDADE</li>
              <li>MAIS CONFORTO PARA O SEU DIA</li>
              <li>UM LAR MAIS NATURAL E ACOLHEDOR</li>
            </ul>
          </div>

          <p class="hero-note">
            DETALHES QUE TRANSFORMAM ROTINAS EM MOMENTOS ESPECIAIS.
          </p>
        </section>
      </div>

      <div class="carousel-item">
        <img
          src="/banner-secundario.png?v=2"
          class="d-block w-100"
          alt="Banner 1"
        />
      </div>

      <div class="carousel-item">
        <img
          src="/banner-principal.png?v=2"
          class="d-block w-100"
          alt="Banner 2"
        />
      </div>

      <div class="carousel-item">
        <img
          src="/banner-grupo-whatsapp.png?v=2"
          class="d-block w-100"
          alt="Banner 3"
        />
      </div>
    </div>
  </div>
</div>
