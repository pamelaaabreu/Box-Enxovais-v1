<div class="auth-form-container">
  <h2>Recuperar Senha</h2>

  <p class="subtitle" *ngIf="step === 1">
    Digite seu e-mail para receber o código de verificação!
  </p>

  <p class="subtitle" *ngIf="step === 2">
    Informe o código recebido e sua nova senha.
  </p>

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
    <div *ngIf="step === 1">
      <div class="form-group">
        <div class="input-wrapper">
          <input class="form-control" type="email" id="email" formControlName="email" placeholder=" " />
          <label class="floating-label" for="email">Email</label>
          <div class="input-underline"></div>
        </div>

        <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
          <small class="error-message">Por favor, insira um email válido.</small>
        </div>
      </div>
    </div>

    <div *ngIf="step === 2">
      <div class="form-group">
        <div class="input-wrapper">
          <input class="form-control" type="text" id="code" formControlName="code" placeholder=" " />
          <label class="floating-label" for="code">Código de verificação</label>
          <div class="input-underline"></div>
        </div>

        <div *ngIf="forgotForm.get('code')?.invalid && forgotForm.get('code')?.touched">
          <small class="error-message">Informe o código recebido.</small>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <input class="form-control" type="password" id="newPassword" formControlName="newPassword" placeholder=" " />
          <label class="floating-label" for="newPassword">Nova senha</label>
          <div class="input-underline"></div>
        </div>

        <div *ngIf="forgotForm.get('newPassword')?.invalid && forgotForm.get('newPassword')?.touched">
          <small class="error-message">
            A senha deve ter no mínimo 6 caracteres.
          </small>
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <button type="button" (click)="step = 1" class="secondary-button">
          Voltar
        </button>
      </div>

    </div>

    <button type="submit" [disabled]="isLoading">
      {{
      isLoading
      ? "Processando..."
      : step === 1
      ? "Enviar Código"
      : "Alterar Senha"
      }}
    </button>
  </form>

  <div class="back-to-login">
    <a routerLink="/login">
      Voltar para o Login
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      </svg>
    </a>
  </div>
</div>
