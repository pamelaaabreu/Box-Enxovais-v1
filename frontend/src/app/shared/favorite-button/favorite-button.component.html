<button
  type="button"
  (click)="toggle($event)"
  [disabled]="disabled()"
  [class.selected]="favorites.isFavorite(productId())"
  [attr.aria-pressed]="favorites.isFavorite(productId())"
  [attr.aria-busy]="busy()"
  [attr.aria-label]="
    busy()
      ? 'Carregando favoritos'
      : favorites.isFavorite(productId())
        ? 'Remover ' + productName() + ' dos favoritos'
        : 'Adicionar ' + productName() + ' aos favoritos'
  "
>
  @if (busy()) {
    <svg class="spinner" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
      />
    </svg>
  }
</button>
@if (message()) {
  <span class="feedback" role="alert"
    >{{ message() }}
    @if (favorites.syncError() && !favorites.loading()) {
      <button class="retry" type="button" (click)="retry($event)">
        Tentar novamente
      </button>
    }
  </span>
}
