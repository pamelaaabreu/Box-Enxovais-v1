<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>Seu código de verificação</title>
    <style>
      @media only screen and (max-width: 620px) {
        .email-shell {
          padding: 16px 10px !important;
        }

        .email-header,
        .email-content,
        .email-footer {
          padding-right: 22px !important;
          padding-left: 22px !important;
        }

        .email-title {
          font-size: 24px !important;
        }

        .verification-code {
          font-size: 24px !important;
          letter-spacing: 0.08em !important;
        }
      }
    </style>
  </head>
  <body
    style="margin: 0; padding: 0; background-color: #f3eee9; color: #262320; font-family: 'Montserrat', Arial, Helvetica, sans-serif;"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="width: 100%; border-collapse: collapse; background-color: #f3eee9;"
    >
      <tr>
        <td class="email-shell" align="center" style="padding: 30px 12px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 100%; max-width: 580px; border-collapse: separate; border-spacing: 0; overflow: hidden; border: 1px solid #d8ccc4; border-radius: 18px; background-color: #fcfaf8; box-shadow: 0 8px 24px rgba(95, 82, 76, 0.06);"
          >
            <tr>
              <td
                class="email-header"
                align="center"
                style="padding: 34px 34px 0; text-align: center"
              >
                <img
                  src="cid:LOGO.png"
                  width="140"
                  alt="Box Enxovais"
                  style="width: 140px; max-width: 100%; height: auto; display: block; margin: 0 auto; border: 0;"
                />
              </td>
            </tr>

            <tr>
              <td
                class="email-content"
                style="padding: 24px 34px 34px; text-align: left"
              >
                <h1
                  class="email-title"
                  style="margin: 0; color: #262320; font-size: 28px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; text-align: center;"
                >
                  Seu código de verificação
                </h1>

                <p
                  style="margin: 12px auto 0; max-width: 430px; color: #5f524c; font-size: 15px; font-weight: 400; line-height: 1.65; text-align: center;"
                >
                  Use o código abaixo para continuar a recuperação da sua
                  senha.
                </p>

                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 100%; margin-top: 26px; border-collapse: separate; border-spacing: 0;"
                >
                  <tr>
                    <td
                      align="center"
                      style="padding: 18px 14px 20px; border: 1px solid #d8ccc4; border-radius: 12px; background-color: #f3eee9; text-align: center;"
                    >
                      <p
                        style="margin: 0 0 8px; color: #894a53; font-size: 10px; font-weight: 700; line-height: 1.4; letter-spacing: 0.1em; text-transform: uppercase;"
                      >
                        Código de verificação
                      </p>
                      <p
                        class="verification-code"
                        style="margin: 0; color: #262320; font-family: 'Montserrat', Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; line-height: 1.25; letter-spacing: 0.1em; overflow-wrap: anywhere;"
                      >
                        {{.Message}}
                      </p>
                    </td>
                  </tr>
                </table>

                <p
                  style="margin: 26px 0 0; color: #6f6761; font-size: 13px; font-weight: 400; line-height: 1.65; text-align: center;"
                >
                  Se você não solicitou a recuperação da sua senha, pode
                  ignorar este e-mail.
                </p>
              </td>
            </tr>

            <tr>
              <td
                class="email-footer"
                style="padding: 21px 34px 24px; border-top: 1px solid #d8ccc4; background-color: #e9dfd8; text-align: center;"
              >
                <p
                  style="margin: 0; color: #5f524c; font-size: 12px; font-weight: 600; line-height: 1.5;"
                >
                  Box Enxovais
                </p>
                <p
                  style="margin: 5px 0 0; color: #6f6761; font-size: 11px; font-weight: 400; line-height: 1.55;"
                >
                  Este é um e-mail automático. Por favor, não responda.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
