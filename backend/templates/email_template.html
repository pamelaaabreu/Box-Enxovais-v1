<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Email</title>
</head>

<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:Arial,Helvetica,sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f9;padding:30px 0;">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0" border="0"
                    style="background:#ffffff;border-radius:8px;border:1px solid #e5e7eb;overflow:hidden;">

                    <!-- Header -->
                    <tr>
                        <td
                            style="background:#1f2937;padding:20px;text-align:center;color:#ffffff;font-size:20px;font-weight:bold;">
                            Box Enxovais
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding:30px;font-size:14px;line-height:22px;color:#374151;text-align:left;">
                            {{.Message}}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td
                            style="background:#f9fafb;padding:15px;text-align:center;font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;">
                            Este é um email automático, por favor não responda.
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
